[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "2.1.6"
description = "Deterministic data transfer format for LLM-to-LLM communication"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0.0",
    "blake3>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "bcrypt>=4.0.0",
    "pynacl>=1.5.0",
    "spake2>=0.9",
    "argon2-cffi>=25.1.0",
]

[project.scripts]
tether = "tether.__main__:main"
tether-mcp = "tether.mcp_server:main"
tether-headless = "tether.headless_cli:main"

[tool.setuptools.packages.find]
include = ["tether*", "relay*"]
