# Tether Job Board (TOML)
# Master task source for the Tether project.
# Tether is the coordination layer for the future of AI communicative infrastructure.
#
# Tiers: red = blocking/critical, orange = high value, yellow = polish/infra, blue = docs, green = maintenance
# Status: open | in_progress | complete | dormant | cancelled

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCT ARCHITECTURE REFERENCE
# ─────────────────────────────────────────────────────────────────────────────
#
# TetherLite   — Free, AGPL. SQLite local. No relay. No caps. The full local protocol.
#                This is the hook. Nobody ever loses this.
#
# Tether Cloud — SaaS. Relay server, API keys, WebSocket push, cross-machine
#                delivery, agent discovery, GUI dashboard. Coordination only —
#                relay routes handles, never stores or sees content. AGPL relay source
#                stays open — "relay-blind" is a trust claim that requires auditability.
#
# Same protocol, same handle format, same MCP tool names across both.
# Code written for TetherLite works on Tether Cloud. Upgrade = change endpoint + pay.
#
# ─────────────────────────────────────────────────────────────────────────────
# PRICING
# ─────────────────────────────────────────────────────────────────────────────
#
# Free (TetherLite)  — SQLite local, unlimited agents, unlimited messages. No relay. No caps. Ever.
#                      The full local coordination layer. WinRAR model — this never disappears.
#
# Duo ($1.99/mo)     — + PAKE passphrase P2P. You and a buddy, direct encrypted channel.
#                      LAN: zero infra, pure P2P. WAN: our STUN server assists NAT traversal only
#                      (never sees content). The "dev tag team" tier.
#
# Basic ($10/mo)     — + hosted relay, up to 10 cross-machine nodes. Each node can connect
#                      unlimited local agents. WebSocket push, agent discovery.
#                      Hosted on brother's server.
#
# Pro ($100/mo)      — + up to 100 nodes. Small companies, large teams. Same feature set as
#                      Basic, bigger network ceiling.
#
# Enterprise (custom) — Self-hosted relay license. Their infra, our software.
#                       For regulated industries that can't route agent traffic through our relay.
#                       Contact Matt. No other option.
#
# What the paywall is: cross-machine reach. Nothing else.
# Local coordination (SQLite, unlimited agents, unlimited messages) is always free.
#
# Licensing: TetherLite = AGPL (relay too — open source is the trust anchor for "relay-blind").
#            Tether Cloud = hosted service. Software is open. Convenience is not.
#
# The pitch: "Are you sick of pasting JSON blobs like I was?"
# Distribution: OpenClaw upstream contribution + Tether Cloud relay as the upgrade path.

