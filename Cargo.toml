[package]
name = "tether"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A local mailbox for CLI agents. SQLite is the bus."
authors = ["Matt"]
readme = "README.md"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
