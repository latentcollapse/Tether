services:
  tether-relay:
    build: .
    container_name: tether-relay
    ports:
      - "${TETHER_RELAY_PORT:-8000}:${TETHER_RELAY_PORT:-8000}"
    volumes:
      - tether-relay-data:/data
    environment:
      - TETHER_RELAY_HOST=0.0.0.0
      - TETHER_RELAY_PORT=${TETHER_RELAY_PORT:-8000}
      - TETHER_RELAY_DB=/data/relay.db
      - TETHER_RELAY_KEY_PREFIX=${TETHER_RELAY_KEY_PREFIX:-tk_live_}
      - TETHER_RELAY_BCRYPT_ROUNDS=${TETHER_RELAY_BCRYPT_ROUNDS:-12}
      - TETHER_RATE_LIMIT_PER_MIN=${TETHER_RATE_LIMIT_PER_MIN:-100}
      - TETHER_ADMIN_KEY=${TETHER_ADMIN_KEY:-change-me}
    restart: unless-stopped

volumes:
  tether-relay-data:
